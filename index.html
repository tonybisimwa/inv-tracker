<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve,
         which the fixed mobile bottom nav depends on. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>INV Tracker — Track your bets. Know your edge.</title>
    <meta name="description" content="A sports betting journal that shows your real P&amp;L, win rate, ROI, and bankroll curve. Scan slips to log bets in seconds." />
    <meta name="theme-color" content="#030712" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Installed as a home-screen app, render into the notch area -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="INV Tracker" />

    <meta property="og:title" content="INV Tracker" />
    <meta property="og:description" content="Track your bets. Know your edge." />
    <meta property="og:type" content="website" />
  </head>
  <body class="bg-gray-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
