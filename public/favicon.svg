<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Statline">
  <!-- Statline mark: three ascending pills reading as a rising performance line.
       Content sits inside the maskable safe zone (centre 80%) so Android's
       circular mask can't clip it. Colours are the app's own tokens:
       canvas gray-950 #030712, accent green-400 #05df72. -->
  <rect width="512" height="512" rx="104" fill="#030712"/>
  <g fill="#05df72">
    <rect x="130" y="282" width="64" height="100" rx="32" opacity="0.52"/>
    <rect x="224" y="212" width="64" height="170" rx="32" opacity="0.76"/>
    <rect x="318" y="130" width="64" height="252" rx="32"/>
  </g>
</svg>
